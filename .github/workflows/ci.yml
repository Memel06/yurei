name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test --ignore-scripts
      - run: npm run pack -w yurei-extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yurei-extension
          path: |
            yurei-extension/yurei-extension.zip
            yurei-extension/yurei-extension-store.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yurei-cli
          path: yurei-kit/dist/yurei.mjs
          if-no-files-found: error

  # The bundle must start on the oldest and newest Node.js we support, and the launcher that Chrome and the MCP
  # clients run is a shell script on POSIX and a .cmd on Windows, so each is exercised once against a throwaway home.
  cli-smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yurei-cli
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install the launcher into a throwaway home and run the CLI through it
        if: runner.os != 'Windows'
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          version="$(node yurei.mjs version)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || { echo "version printed '$version'"; exit 1; }
          node yurei.mjs config generic | grep -q '"mcpServers"'
          test "$("$HOME/.yurei/yurei" version)" = "$version" || { echo "the launcher did not run the CLI"; exit 1; }
          test -f "$HOME/.agents/skills/yurei/SKILL.md"
      - name: Install the launcher into a throwaway home and run the CLI through it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $version = (node yurei.mjs version | Out-String).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "version printed '$version'" }
          $config = node yurei.mjs config generic | Out-String
          if ($config -notmatch '"mcpServers"') { throw "config printed '$config'" }
          $viaLauncher = (& "$env:USERPROFILE\.yurei\yurei.cmd" version | Out-String).Trim()
          if ($viaLauncher -ne $version) { throw "the launcher printed '$viaLauncher'" }
          if (-not (Test-Path "$env:USERPROFILE\.agents\skills\yurei\SKILL.md")) { throw "skill missing" }

  # Single required status check for branch protection.
  ok:
    name: CI passed
    needs: [build, cli-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = success && test "${{ needs.cli-smoke.result }}" = success
