<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Yurei</title>
    <style>
      @font-face { font-family: "Shippori Mincho B1"; font-weight: 700; src: url(fonts/shippori-mincho-b1-700-latin.woff2) format("woff2"); }
      @font-face { font-family: "Yuji Syuku"; font-weight: 400; src: url(fonts/yuji-syuku-yurei.woff2) format("woff2"); }
      :root {
        --night: #0a0b12; --night-2: #12141f; --line: rgba(232, 227, 214, .13);
        --ink: #e8e3d6; --dim: #a39f96;
        --paper: #f2ecdf; --paper-ink: #1b1a22; --paper-dim: #5d5a66;
        --blue: #4274f2; --shu: #c73a27;
        --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
        --brush: "Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", serif;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      body { width: 320px; margin: 0; padding: 16px; background: var(--night); color: var(--ink); font: 400 13px/1.5 var(--sans); }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
      header img { width: 44px; height: 44px; filter: drop-shadow(0 0 10px rgba(66, 116, 242, .45)); }
      h1 { margin: 0; font: 700 22px/1 var(--display); letter-spacing: -.01em; }
      h1 small { display: block; margin-top: 5px; font: 500 10px/1 var(--mono); letter-spacing: .14em; color: var(--dim); }
      .kanji { margin-left: auto; writing-mode: vertical-rl; text-orientation: upright; font: 400 21px/1 var(--brush); letter-spacing: .08em; color: var(--ink); opacity: .85; user-select: none; }
      .ofuda {
        position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 14px 66px 14px 16px;
        background-image: repeating-linear-gradient(90deg, rgba(27, 26, 34, .035) 0 1px, transparent 1px 22px);
        box-shadow: 0 20px 40px -24px rgba(66, 116, 242, .35), 0 1px 0 rgba(255, 255, 255, .6) inset;
      }
      .kicker { margin: 0 0 8px; font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--paper-dim); }
      #status { display: flex; align-items: center; gap: 8px; font: 700 15px/1.2 var(--display); }
      .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #b8b2a6; }
      .dot.on { background: var(--blue); box-shadow: 0 0 0 3px rgba(66, 116, 242, .18), 0 0 12px rgba(66, 116, 242, .8); }
      ul { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
      ul:empty { display: none; }
      li { border: 1px solid rgba(27, 26, 34, .25); border-radius: 999px; padding: 4px 10px; font: 600 12px/1 var(--sans); }
      .seal {
        position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; padding: 0;
        color: var(--shu); font: 400 15px/1.05 var(--brush); -webkit-text-stroke: .3px var(--shu); text-shadow: 0 0 .6px var(--shu);
        transform: rotate(-6deg); border-radius: 12%; cursor: pointer; user-select: none;
        background: linear-gradient(135deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 50%), radial-gradient(120% 100% at 30% 20%, #fff 0, #fbf8f1 45%, #e6dfd1 100%);
        box-shadow: inset 0 0 0 3px #fbf8f1, inset 0 0 0 5px var(--shu), inset 0 0 0 6px rgba(199, 58, 39, .3), 0 1px 2px rgba(27, 26, 34, .25), 0 8px 14px -8px rgba(27, 26, 34, .45);
        transition: transform .15s ease;
      }
      .seal span { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: .06em; }
      .seal:hover { transform: rotate(-2deg); }
      .seal.shake { animation: shake .5s ease-in-out; }
      @keyframes shake { 0%, 100% { transform: rotate(-6deg); } 25% { transform: rotate(4deg) translateX(-2px); } 50% { transform: rotate(-10deg) translateX(2px); } 75% { transform: rotate(2deg); } }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 0 14px; border-radius: 999px;
        border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 13px/1 var(--sans); cursor: pointer;
        transition: transform .15s ease, border-color .15s ease;
      }
      .btn:hover { transform: translateY(-1px); border-color: rgba(232, 227, 214, .35); }
      label { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
      input[type=color] { width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: none; cursor: pointer; }
      input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
      input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
      .help { margin: 14px 0 0; color: var(--dim); font-size: 12px; }
      code { font: 500 11px/1 var(--mono); background: var(--night-2); border: 1px solid var(--line); padding: 2px 6px; border-radius: 6px; color: var(--ink); white-space: nowrap; }
      footer { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
      footer a { color: var(--dim); text-decoration: none; }
      footer a:hover { color: var(--ink); }
      @media (prefers-reduced-motion: reduce) { .seal, .btn { transition: none; } .seal.shake { animation: none; } }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-128.png" alt="" width="44" height="44" />
      <h1>Yurei<small id="version"></small></h1>
      <span class="kanji" lang="ja" aria-hidden="true">幽霊</span>
    </header>
    <section class="ofuda">
      <p class="kicker">Status</p>
      <div id="status"><span class="dot" id="dot"></span><span id="status-text">Looking for the ghost…</span></div>
      <ul id="list"></ul>
      <button class="seal" id="stop" type="button" title="Stop everything Yurei is doing" aria-label="封印, stop everything Yurei is doing"><span lang="ja">封印</span></button>
    </section>
    <div class="row">
      <button class="btn" id="reconnect" type="button">Reconnect</button>
      <label>Glow <input type="color" id="accent" /></label>
    </div>
    <p class="help" id="help"></p>
    <footer><a href="https://yurei.web.app" target="_blank" rel="noreferrer">yurei.web.app</a><span>MIT</span></footer>
    <script src="popup.js"></script>
  </body>
</html>
